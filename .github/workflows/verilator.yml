name: AeroCore-V CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  hardware-verify:
    name: Verilator RTL Simulation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install Toolchain & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator make gcc g++ gcc-riscv64-unknown-elf python3-pip
        pip3 install pyelftools

    - name: Compile Bare-Metal Verification Tests
      run: |
        cd sim/tests
        make CC=riscv64-unknown-elf-gcc

    - name: Stage a self-checking test as the boot image
      run: |
        cp sim/tests/uart_loopback_test.hex sw/kernel.hex

    - name: Build and Run Verilator Testbench
      run: |
        cd sim/verilator
        make test VERILATOR_INCLUDE=/usr/share/verilator/include
        ./run_test

    - name: Build the real flight kernel
      run: |
        cd sw
        make CC=riscv64-unknown-elf-gcc